    <!-- Branded first-paint splash (shown until React mounts) -->
    <style id="boot-splash-style">
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #1A1A1A;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.5s ease;
      }
      #boot-splash img { width: 88px; height: 88px; }
      #boot-splash .bs-name {
        margin-top: 22px; color: #fff; font-family: Georgia, 'Times New Roman', serif;
        font-size: 26px; font-weight: 700; letter-spacing: 4px;
      }
      #boot-splash .bs-sub {
        margin-top: 10px; color: #C9A96E; font-family: Georgia, serif;
        font-size: 11px; letter-spacing: 7px;
      }
      #boot-splash .bs-bar {
        margin-top: 34px; width: 120px; height: 1px;
        background: linear-gradient(90deg, transparent, #C9A96E, transparent);
        animation: bs-pulse 1.6s ease-in-out infinite;
      }
      @keyframes bs-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      #boot-splash.bs-hide { opacity: 0; pointer-events: none; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/images/logo-white.png" alt="" />
      <div class="bs-name">ETHIO-CAN</div>
      <div class="bs-sub">GEMSTONES</div>
      <div class="bs-bar"></div>
    </div>
    <div id="root"></div>
    <script>
      // Fade the static splash as soon as React takes over (or after 4s failsafe).
      window.addEventListener('load', function () {
        var s = document.getElementById('boot-splash');
        if (!s) return;
        var hide = function () {
          s.classList.add('bs-hide');
          setTimeout(function () { s.remove(); }, 600);
        };
        var root = document.getElementById('root');
        if (root && root.childElementCount > 0) { hide(); }
        else { setTimeout(hide, 2500); }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
